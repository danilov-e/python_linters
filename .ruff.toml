# Единый лимит для эксперимента
# line-length = 100

# Стандартный размер отступа
# indent-width = 4


[lint]

# Собираем несколько семейств проверок в одном линтере
# select = [
#    "E",   # стиль pycodestyle
#    "F",   # ошибки Pyflakes
#    "B",   # правила Bugbear
#    "UP",  # современные конструкции Python
#    "I",   # сортировка импортов
#    "SIM", # упрощение кода
# ]

# E501 специально включаем отдельно:
# Ruff по умолчанию не включает это правило вместе с formatter
# extend-select = ["E501"]

# Эти правила можно исправлять через --fix
# fixable = [
#    "E",
#    "F",
#    "I",
#    "UP",
# ]

# Bugbear автоматически не исправляем
# unfixable = ["B"]

# Для __init__.py разрешаем неиспользуемые импорты
# [lint.per-file-ignores]
# "__init__.py" = ["F401"]


[format]

# Настройки форматтера Ruff
# quote-style = "double"
# indent-style = "space"
# line-ending = "auto"